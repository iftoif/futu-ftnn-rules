name: Validate

on:
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "rules/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Shadowrocket files
        run: bash scripts/validate.sh
