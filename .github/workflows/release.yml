name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid semantic version tag: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac

      - name: Validate Shadowrocket files
        run: bash scripts/validate.sh

      - name: Generate release assets
        run: |
          bash scripts/generate_checksums.sh
          bash scripts/generate_changelog.sh dist/CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/CHANGELOG.md
          files: |
            dist/modules/FTNN.module
            dist/modules/coding.module
            dist/modules/social-media.module
            dist/rules/default.conf
            dist/sha256.txt
            dist/md5.txt
            dist/CHANGELOG.md
